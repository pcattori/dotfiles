[tools]
ast-grep = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
neovim = "latest"
node = "lts"
ripgrep = "latest"
zoxide = "latest"

[bootstrap.packages]
"brew:git" = "latest"
"brew:herdr" = "latest"
"brew:pi-coding-agent" = "latest"
"brew:tree" = "latest"
"brew:typst" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "rust"]

[dotfiles]
"~" = { source = "~/dev/dotfiles/home", mode = "symlink-each" }
